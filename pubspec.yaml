name: realtime_chat
description: Real-time chat over WebSocket built with Flutter, Bloc and Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
